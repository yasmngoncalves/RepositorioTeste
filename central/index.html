<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF1EC"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Central da Yasmin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única estilo app (máx 560px), conteúdo em seções, barra de navegação fixa embaixo */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#E3E8E1; --ink:#17201B; --muted:#5B685F; --line:#D3DACF;
  --accent:#2A47F5; --accent-ink:#FFFFFF; --accent-soft:#DCE2FF; --sun:#F6B524; --sun-soft:#FCEBC0;
  --good:#1D8456; --warn:#B86A10; --bad:#CF3B32;
  --c0:#2F6BFF; --c1:#1E9E63; --c2:#E0457B; --c3:#EE8417; --c4:#7B4DE0; --c5:#0FA3A8; --on-c:#FFFFFF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101411; --surface:#181D19; --surface-2:#232A24; --ink:#E9EEE9; --muted:#9AA69E; --line:#2E3830;
  --accent:#8F9DFF; --accent-ink:#0E1330; --accent-soft:#252C5A; --sun:#F6C14A; --sun-soft:#3A3018;
  --good:#4CC38A; --warn:#E8A24A; --bad:#F06A60; --c0:#7EA2FF; --c1:#4FD08F; --c2:#FF7FA8; --c3:#FFB057; --c4:#B097FF; --c5:#4FD6D9; --on-c:#0D100E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101411; --surface:#181D19; --surface-2:#232A24; --ink:#E9EEE9; --muted:#9AA69E; --line:#2E3830;
  --accent:#8F9DFF; --accent-ink:#0E1330; --accent-soft:#252C5A; --sun:#F6C14A; --sun-soft:#3A3018;
  --good:#4CC38A; --warn:#E8A24A; --bad:#F06A60; --c0:#7EA2FF; --c1:#4FD08F; --c2:#FF7FA8; --c3:#FFB057; --c4:#B097FF; --c5:#4FD6D9; --on-c:#0D100E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:18px 8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Cabeçalho do dia */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.03em}
.hero .big span{color:var(--accent)}
.hero .sub{font-family:var(--display);font-size:18px;font-weight:500;color:var(--muted)}
.hero .hi{text-align:right;font-size:14px;color:var(--muted);max-width:50%}
.hero .hi b{display:block;color:var(--ink);font-family:var(--display);font-size:18px}

/* Cards e listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}

.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.chk[aria-pressed="true"]::after{content:"";width:10px;height:6px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb, var(--warn) 16%, transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.pill.ex{background:transparent;border:1px dashed var(--line);font-weight:500}

.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon-btn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;padding:0;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Hábitos: cada hábito tem sua cor (--hc) */
.habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.habit{--hc:var(--accent);background:color-mix(in srgb, var(--hc) 10%, var(--surface));border:1px solid color-mix(in srgb, var(--hc) 22%, var(--line));border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.habit .hn{font-weight:600;font-size:14px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;min-width:0}
.habit .hv{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.habit .hv small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.habit .bar{background:color-mix(in srgb, var(--hc) 18%, var(--surface-2))}
.habit .bar i{background:var(--hc)}
.habit .ctl{display:flex;gap:6px}
.habit .ctl button{flex:1;border:0;border-radius:10px;padding:7px 0;font-weight:700;background:color-mix(in srgb, var(--hc) 16%, var(--surface-2))}
.habit .ctl button.plus{background:var(--hc);color:var(--on-c)}
.hico{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb, var(--hc, var(--accent)) 20%, var(--surface))}
.fogo{font-size:12px;font-weight:700;color:var(--hc);margin-left:auto;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.stat.hot{background:color-mix(in srgb, var(--hc) 18%, var(--surface));color:var(--ink)}

/* Gamificação */
.game{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.game .lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.game .lvl b{font-family:var(--display);font-size:28px;line-height:1}
.game .lvl span{opacity:.75;font-size:14px}
.game .bar{background:color-mix(in srgb, var(--bg) 22%, transparent)}
.game .bar i{background:var(--sun)}
.game .big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.game .big3 div{background:color-mix(in srgb, var(--bg) 10%, transparent);border-radius:10px;padding:8px 10px}
.game .big3 b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.game .big3 small{opacity:.75;font-size:11px}
.medals{display:flex;gap:6px;flex-wrap:wrap}
.medal{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;padding:6px 0;border-radius:10px;font-size:10px;font-weight:600;background:color-mix(in srgb, var(--bg) 8%, transparent);opacity:.45}
.medal i{font-style:normal;font-size:20px;filter:grayscale(1)}
.medal.on{opacity:1;background:color-mix(in srgb, var(--sun) 28%, transparent)}
.medal.on i{filter:none}

/* Calendário */
.cal{display:flex;flex-direction:column;gap:4px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h b{font-size:10px;text-align:center;color:var(--muted);font-weight:600}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-d.cheio{color:var(--on-c)}
.cal-d.parcial{color:var(--ink)}
.cal-d.fut{background:transparent;border:1px dashed var(--line);opacity:.6}
.cal-d.hoje{outline:2px solid var(--ink);outline-offset:1px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav b{font-family:var(--display);font-size:16px;text-transform:capitalize}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Pickers do formulário */
.emoji-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emoji-pick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:40px;font-size:20px;padding:0}
.emoji-pick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.cor-pick{display:flex;gap:8px;flex-wrap:wrap}
.cor-pick button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.cor-pick button[aria-pressed="true"]{border-color:var(--ink)}

/* Plano do ano */
.ano-hero{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ano-hero .ano{font-family:var(--display);font-weight:800;font-size:72px;line-height:.9;letter-spacing:-.04em}
.ano-hero .ano span{color:var(--accent)}
.palavra{display:flex;flex-direction:column;gap:4px}
.palavra input{border:0;border-bottom:2px solid var(--line);background:transparent;font-family:var(--display);font-size:24px;font-weight:700;padding:4px 0;width:100%;border-radius:0}
.palavra input:focus{outline:none;border-bottom-color:var(--accent)}
.focos{display:flex;flex-direction:column;gap:8px}
.foco{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);min-width:0}
.foco .n{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;opacity:.9}
.foco .t{font-weight:600;overflow-wrap:anywhere}
.foco small{opacity:.8;font-size:12px}
.foco.vazio{background:transparent;color:var(--muted);border:1.5px dashed var(--line)}
.mood{columns:3 120px;column-gap:8px}
.mood figure{margin:0 0 8px;break-inside:avoid;position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.mood img{display:block;width:100%;height:auto}
.mood figure button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:0}
.mood-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.area-h{display:flex;align-items:center;gap:8px;min-width:0}
.area-h h3{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.meta .t{flex:1;min-width:0;overflow-wrap:anywhere}
.meta.done .t{text-decoration:line-through;color:var(--muted)}
.star{border:0;background:transparent;font-size:18px;padding:0 2px;line-height:1;opacity:.35;filter:grayscale(1)}
.star[aria-pressed="true"]{opacity:1;filter:none}
.add-meta{display:flex;gap:6px;align-items:center}
.add-meta input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.add-meta .mic{width:36px;height:36px}
.add-meta .mic svg{width:18px;height:18px}
.input-line{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-width:0}

/* Treino */
.ex-table{width:100%;border-collapse:collapse;font-size:14px}
.ex-table td{padding:6px 0;border-top:1px solid var(--line)}
.ex-table tr:first-child td{border-top:0}
.ex-table td.r{text-align:right;color:var(--muted);white-space:nowrap;padding-left:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.days span.on{background:var(--accent-soft);color:var(--accent)}
.prewrap{white-space:pre-line;font-size:14px;color:var(--muted)}

/* Agenda */
.date-badge{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.date-badge b{display:block;font-family:var(--display);font-size:18px}
.date-badge small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date-badge.today{background:var(--accent);color:var(--accent-ink)}
.date-badge.today small{color:var(--accent-ink)}

/* Grana */
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.money .card{padding:12px}
.money .v{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.budget{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.budget:first-child{border-top:0}
.budget .bar i.over{background:var(--bad)}
.budget .bar i.near{background:var(--warn)}

/* Agente */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:transparent;color:var(--muted);font-size:13px;padding:2px 4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;min-height:44px;max-height:140px}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;padding:0;position:relative}
.mic svg{width:22px;height:22px}
.mic[data-on="true"]{background:var(--bad);color:#fff}
.mic[data-on="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--bad);animation:pulso 1.2s ease-out infinite}
@keyframes pulso{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.voz-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.voz-hint{font-size:12px;color:var(--muted)}
.agent-intro{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.agent-intro h2{font-size:22px}
.agent-intro p{margin:0;opacity:.8;font-size:14px}

/* Navegação inferior */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Formulário (folha que sobe) */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;text-transform:uppercase}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--sun);font-weight:700}
.note{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.hero .big{font-size:52px}.money{grid-template-columns:1fr 1fr}.money .card:last-child{grid-column:span 2}}
</style>

<div class="app" id="app"><p class="note">Abrindo sua central…</p></div>
<nav class="tabs" aria-label="Seções"><div class="in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hoje = () => iso(new Date());

function startLocal() {
  mode = "local";
  let algum = false;
  for (const a of [...AREAS, "log"]) {
    try { const v = JSON.parse(localStorage.getItem("central:" + a) || "null"); if (v) { algum = true; if (a === "log") S.log = v; else S[a] = arr(v); } } catch (e) {}
  }
  if (!algum) { const e = exemplos(); for (const a of AREAS) { S[a] = e[a]; persist(a); } }
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("central:ano-")) S.anos[k.slice(12)] = JSON.parse(localStorage.getItem(k)); } } catch (e) {}
  S.habitos = S.habitos.map(fixHab);
  carregou = true; render();
}
async function init() {
  window.addEventListener("hashchange", render);
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function") { startLocal(); return; }
  const timer = setTimeout(() => { if (!carregou) { aviso = "Seus dados estão demorando pra chegar. Confira a internet."; render(); } }, 10000);
  db = await c.use("db");
  if (!db) { clearTimeout(timer); startLocal(); return; }
  mode = "db";
  db.collection("central").onSnapshot(snap => {
    clearTimeout(timer);
    if (!snap.metadata.fromCache) aviso = "";
    for (const d of snap.docs) {
      const a = d.id, v = d.data() || {};
      if (writing[a] || pending[a]) continue;
      if (a === "log") S.log = { days: JSON.parse(JSON.stringify(v.days || {})) };
      else if (a.startsWith("ano-")) S.anos[a.slice(4)] = JSON.parse(JSON.stringify(v));
      else if (AREAS.includes(a)) S[a] = JSON.parse(JSON.stringify(arr(v.items)));
    }
    S.habitos = S.habitos.map(fixHab);
    carregou = true; render();
  }, e => { clearTimeout(timer); aviso = "Não consegui abrir seus dados. Recarregue a página."; carregou = true; render(); });
  c.use("sample").then(s => { sample = s; if (rota() === "agente") render(); });
  c.use("dictation").then(d => { if (!d) return; dict = d; ligarDitado(d); render(); });
  c.use("assets").then(a => { assets = a; if (rota() === "ano") render(); });
}

function ligarDitado(d) {
  d.onPartial(({ text }) => { const el = document.getElementById(voz.alvo); if (el) el.value = juntar(voz.base, text); });
  d.onFinal(({ text }) => {
    voz.base = juntar(voz.base, text);

  return `

function habCard(hb) {
  const v = habVal(hb.id), p = Math.min(100, Math.round(v / hb.meta * 100)), sd = seqDias(hb);
  return `<div class="habit" style="--hc:${cor(hb.cor)}">
    <div class="hn"><span class="hico">${esc(hb.icone)}</span><span class="grow">${esc(hb.nome)}</span>${sd ? `<span class="fogo">🔥${sd}</span>` : ""}</div>
    <div class="hv num">${fmtNum(v)}<small> / ${fmtNum(hb.meta)} ${esc(hb.unidade)}</small></div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="ctl"><button data-act="hab" data-id="${hb.id}" data-d="-1" aria-label="Diminuir ${esc(hb.nome)}">−</button><button class="plus" data-act="hab" data-id="${hb.id}" data-d="1" aria-label="Somar ${esc(hb.nome)}">+${fmtNum(hb.passo)}</button></div>
  </div>`;
}

/* ===== sequências e gamificação ===== */
const bateu = (hb, d) => habVal(hb.id, d) >= hb.meta;
function seqDias(hb) {
  let d = hoje(), n = 0;
  if (!bateu(hb, d)) d = addDias(d, -1);
  while (bateu(hb, d) && n < 400) { n++; d = addDias(d, -1); }
  return n;
}
const segunda = s => addDias(s, -((new Date(s + "T12:00").getDay() + 6) % 7));
function diasNaSemana(hb, seg) { let c = 0; for (let i = 0; i < 7; i++) { const d = addDias(seg, i); if (d > hoje()) break; if (bateu(hb, d)) c++; } return c; }
function seqSemanas(hb) {
  let seg = segunda(hoje()), n = 0;
  if (diasNaSemana(hb, seg) < hb.vezesSemana) seg = addDias(seg, -7);
  while (diasNaSemana(hb, seg) >= hb.vezesSemana && n < 60) { n++; seg = addDias(seg, -7); }
  return n;
}
function pctMes(hb, ym = mesAtual()) {
  const [y, m] = ym.split("-").map(Number), total = new Date(y, m, 0).getDate();
  let feitos = 0, passados = 0;
  for (let i = 1; i <= total; i++) { const d = ym + "-" + pad(i); if (d > hoje()) break; passados++; if (bateu(hb, d)) feitos++; }
  const esperado = passados * hb.vezesSemana / 7;
  return esperado ? Math.min(100, Math.round(feitos / esperado * 100)) : 0;
}
const recorde = hb => Math.max(hb.recorde || 0, seqDias(hb));
const MEDALHAS = [[3, "🌱", "3 dias"], [7, "🔥", "1 semana"], [14, "⚡", "2 semanas"], [21, "💎", "21 dias"], [30, "🏅", "1 mês"], [66, "🧠", "Hábito formado"], [100, "👑", "100 dias"]];
const NIVEIS = ["Começando", "Pegando o ritmo", "Constante", "Focada", "Disciplinada", "Imparável", "Lenda"];
function xpTotal() {
  let xp = 0;
  for (const d in S.log.days) {
    const x = S.log.days[d];
    for (const hb of S.habitos) if (x.h && (x.h[hb.id] || 0) >= hb.meta) xp += 10;
    xp += (x.t || []).length * 25 + (x.m || []).length * 3;
  }
  return xp;
}
function fracDia(d) { if (!S.habitos.length) return 0; return S.habitos.filter(hb => bateu(hb, d)).length / S.habitos.length; }
function diasPerfeitos() { let d = hoje(), n = 0; if (fracDia(d) < 1) d = addDias(d, -1); while (S.habitos.length && fracDia(d) >= 1 && n < 400) { n++; d = addDias(d, -1); } return n; }

function calendario(ym, valor, c) {
  const [y, m] = ym.split("-").map(Number), off = (new Date(y, m - 1, 1).getDay() + 6) % 7, total = new Date(y, m, 0).getDate();
  let cells = "<span></span>".repeat(off);
  for (let i = 1; i <= total; i++) {
    const d = ym + "-" + pad(i), fut = d > hoje(), v = fut ? 0 : Math.min(1, valor(d));
    const bg = fut || !v ? "" : v >= 1 ? `background:${c}` : `background:color-mix(in srgb, ${c} ${Math.round(20 + v * 45)}%, var(--surface-2))`;
    cells += `<span class="cal-d${d === hoje() ? " hoje" : ""}${fut ? " fut" : ""}${v >= 1 ? " cheio" : v > 0 ? " parcial" : ""}" style="${bg}" title="${fmtData(d)}">${i}</span>`;
  }
  return `<div class="cal"><div class="cal-h">${["S", "T", "Q", "Q", "S", "S", "D"].map(x => `<b>${x}</b>`).join("")}</div><div class="cal-g">${cells}</div></div>`;
}
function navMes() {
  const [y, m] = ui.calMes.split("-").map(Number);
  return `<div class="cal-nav"><button class="icon-btn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button><b>${MESES[m - 1]} ${y}</b><button class="icon-btn" data-act="mes" data-d="1" aria-label="Próximo mês" ${ui.calMes >= mesAtual() ? "disabled" : ""}>›</button></div>`;
}
function vHabitos() {
  const xp = xpTotal(), nivel = Math.floor(xp / 300) + 1, prog = Math.round((xp % 300) / 3);
  const melhor = Math.max(0, ...S.habitos.map(recorde)), perfeitos = diasPerfeitos();
  const semanas = S.habitos.length ? Math.max(...S.habitos.map(seqSemanas)) : 0;
  const mediaMes = S.habitos.length ? Math.round(S.habitos.reduce((s, hb) => s + pctMes(hb), 0) / S.habitos.length) : 0;
  return `<section class="game" aria-label="Seu progresso">
      <div class="lvl"><b>Nível ${nivel}</b><span>${NIVEIS[Math.min(nivel - 1, NIVEIS.length - 1)]} · ${xp} XP</span></div>
      <div class="bar" aria-label="Progresso pro próximo nível"><i style="width:${prog}%"></i></div>
      <div class="big3"><div><b class="num">🔥 ${perfeitos}</b><small>dias perfeitos seguidos</small></div><div><b class="num">${semanas}</b><small>semanas seguidas na meta</small></div><div><b class="num">${mediaMes}%</b><small>do mês cumprido</small></div></div>
      <div class="medals">${MEDALHAS.map(([n, e, l]) => `<div class="medal ${melhor >= n ? "on" : ""}" title="${l}"><i>${e}</i>${l}</div>`).join("")}</div>
    </section>
    <section class="sec card">${navMes()}${calendario(ui.calMes, fracDia, "var(--accent)")}
      <div class="legend"><span>menos</span><i style="background:var(--surface-2)"></i><i style="background:color-mix(in srgb, var(--accent) 40%, var(--surface-2))"></i><i style="background:color-mix(in srgb, var(--accent) 65%, var(--surface-2))"></i><i style="background:var(--accent)"></i><span>todos os hábitos</span></div>
    </section>
    <section class="sec">${head("Meus hábitos", "habitos", "Hábito")}
    ${S.habitos.length ? S.habitos.map(hb => {
      const v = habVal(hb.id), sd = seqDias(hb), ss = seqSemanas(hb), aberto = ui.habAberto[hb.id];
      return `<div class="habit" style="--hc:${cor(hb.cor)}">
        <div class="hn"><span class="hico">${esc(hb.icone)}</span><span class="grow">${esc(hb.nome)}${exTag(hb)}<br><span class="small muted num" style="font-weight:500">${fmtNum(v)}/${fmtNum(hb.meta)} ${esc(hb.unidade)} hoje · ${hb.vezesSemana === 7 ? "todo dia" : hb.vezesSemana + "x por semana"}</span></span>${acts("habitos", hb.id)}</div>
        <div class="stats"><span class="stat hot">🔥 ${sd} dia${sd === 1 ? "" : "s"}</span><span class="stat">📅 ${ss} semana${ss === 1 ? "" : "s"}</span><span class="stat">${pctMes(hb)}% do mês</span><span class="stat">🏆 recorde ${recorde(hb)}</span></div>
        <div class="ctl"><button data-act="hab" data-id="${hb.id}" data-d="-1" aria-label="Diminuir">−</button><button class="plus" data-act="hab" data-id="${hb.id}" data-d="1" aria-label="Somar">+${fmtNum(hb.passo)}</button><button data-act="hab-cal" data-id="${hb.id}" aria-expanded="${!!aberto}">${aberto ? "Fechar" : "Calendário"}</button></div>
        ${aberto ? `${navMes()}${calendario(ui.calMes, d => habVal(hb.id, d) / hb.meta, cor(hb.cor))}` : ""}
      </div>`;
    }).join("") : `<div class="list"><div class="empty">Nenhum hábito ainda. Crie o primeiro e escolha um ícone e uma cor.</div></div>`}
    </section>`;
}
const fmtNum = n => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const ordenaRef = l => [...l].sort((a, b) => (a.hora || "99").localeCompare(b.hora || "99"));
function exTable(t) {
  if (!t.exercicios.length) return `<p class="small muted">Sem exercícios ainda.</p>`;
  return `<table class="ex-table"><tbody>${t.exercicios.map(e => `<tr><td>${esc(e.nome)}</td><td class="r num">${e.series}×${esc(e.reps)}${e.carga ? " · " + esc(e.carga) : ""}</td></tr>`).join("")}</tbody></table>`;
}
function tarefaRow(t) {
  const h = hoje(), atras = t.data && t.data < h && !t.feito;
  const quando = !t.data ? "" : t.data === h ? "hoje" : atras ? `atrasada · ${fmtData(t.data)}` : fmtData(t.data);
  return `<div class="item ${t.feito ? "done" : ""}">

    <div class="grow"><div class="t">${esc(t.titulo)}</div><div class="row small" style="gap:6px;flex-wrap:wrap"><span class="pill">${t.tipo}</span>${quando ? `<span class="pill ${atras ? "bad" : ""}">${quando}</span>` : ""}${exTag(t)}</div></div>
    ${acts("tarefas", t.id)}</div>`;
}
function badge(data) {
  const d = new Date(data + "T12:00");
  return `<div class="date-badge ${data === hoje() ? "today" : ""}"><small>${DIAS[d.getDay()]}</small><b class="num">${d.getDate()}</b></div>`;
}
function evRow(e, comAcoes = true) {
  return `<div class="item">${badge(e.data)}<div class="grow"><div class="t">${esc(e.titulo)}${exTag(e)}</div><div class="small muted">${[e.hora, e.local].filter(Boolean).map(esc).join(" · ") || "dia todo"}</div></div>${comAcoes ? acts("agenda", e.id) : `<span class="pill accent">evento</span>`}</div>`;

function contaRow(c, comAcoes = true) {
  const n = diasAte(c.vencimento);
  const st = c.pago ? `<span class="pill good">paga</span>` : n < 0 ? `<span class="pill bad">atrasada ${-n}d</span>` : n === 0 ? `<span class="pill warn">vence hoje</span>` : n <= 5 ? `<span class="pill warn">vence em ${n}d</span>` : `<span class="pill">${fmtData(c.vencimento)}</span>`;
  return `<div class="item ${c.pago ? "done" : ""}">

    ${comAcoes ? acts("contas", c.id) : ""}</div>`;
}

    if (c.t === "textarea") input = `<textarea id="${idc}" placeholder="${esc(c.ph || "")}">${esc(v)}</textarea>`;
    else if (c.t === "select") input = `<select id="${idc}">${c.op.map(([k, n]) => `<option value="${k}" ${v === k ? "selected" : ""}>${n}</option>`).join("")}</select>`;
    else if (c.t === "icone") input = `<div class="emoji-pick" id="${idc}">${[...new Set([form.icone, ...EMOJIS])].map(e => `<button type="button" data-act="icone-pick" aria-pressed="${e === form.icone}" aria-label="${e}">${e}</button>`).join("")}</div>`;
    else if (c.t === "cor") input = `<div class="cor-pick" id="${idc}">${Array.from({ length: CORES }, (_, i) => `<button type="button" data-act="cor-pick" data-i="${i}" style="background:${cor(i)}" aria-pressed="${i === form.cor}" aria-label="Cor ${i + 1}"></button>`).join("")}</div>`;
    else if (c.t === "dias") input = `<div class="daypick" id="${idc}">${DIAS.map((n, i) => `<button type="button" data-act="dia-pick" data-i="${i}" aria-pressed="${form.dias.has(i)}">${n}</button>`).join("")}</div>`;
    else if (c.t === "cat") input = `<input id="${idc}" list="cats" value="${esc(v)}" placeholder="Mercado"><datalist id="cats">${cats.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`;
    else input = `<input id="${idc}" type="${c.t === "number" ? "text" : c.t || "text"}" ${c.t === "number" ? 'inputmode="decimal"' : ""} value="${esc(c.t === "number" && v !== "" ? String(v).replace(".", ",") : v)}" placeholder="${esc(c.ph || "")}">`;
    return `<div class="field"><label ${["icone", "cor", "dias"].includes(c.t) ? "" : `for="${idc}"`}>${c.l}</label>${input}${c.hint ? `<span class="hint">${c.hint}</span>` : ""}</div>`;
  };
  $("#sheet").innerHTML = `<div class="sheet-wrap" data-act="fechar-fundo"><form class="sheet" id="form" role="dialog" aria-label="${cfg.titulo}">
    <div class="row"><h2 class="grow">${it ? "Editar" : "Nova"} ${cfg.titulo.toLowerCase()}</h2><button type="button" class="icon-btn" data-act="fechar" aria-label="Fechar">✕</button></div>
    ${cfg.campos.map(c => c.two ? `<div class="two">${c.two.map(campo).join("")}</div>` : campo(c)).join("")}
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
  </form></div>`;
  $("#sheet").hidden = false;
  $("#form").addEventListener("submit", e => { e.preventDefault(); salvarForm(); });
  const first = $("#form input, #form textarea"); first && first.focus();
}
function salvarForm() {
  const { area, id } = form, o = {};
  const walk = l => l.forEach(c => c.two ? walk(c.two) : c.t === "icone" ? (o.icone = form.icone) : c.t === "cor" ? (o.cor = form.cor) : c.t !== "dias" && (o[c.k] = $("#f-" + c.k).value));
  walk(FORMS[area].campos);
  if (area === "treinos") { o.dias = [...form.dias].sort(); o.exercicios = textToEx(o.exercicios); }
  const L = lista(area), old = id && L.find(x => x.id === id);
  if (old && area === "tarefas") o.feito = old.feito;
  if (old && area === "contas") o.pago = old.pago;
  if (old && area === "habitos") o.recorde = old.recorde;
  if (old && area === "areaAno") o.metas = old.metas;
  const novo = norm(area, o, id);
  if (old) L[L.indexOf(old)] = novo; else L.push(novo);
  fechar(); persist(chave(area)); render(); toast(old ? "Salvo" : `${FORMS[area].titulo} adicionado`);
}
function fechar() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; form = null; }

/* ===== toast com desfazer ===== */
let tTimer, desfazer = null;
function toast(msg, undo) {
  const t = $("#toast"); desfazer = undo || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="desfazer">Desfazer</button>` : ""}`;
  t.hidden = false; clearTimeout(tTimer); tTimer = setTimeout(() => { t.hidden = true; desfazer = null; }, 4500);
}

/* ===== cliques ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, area = b.dataset.area, id = b.dataset.id;
  if (a === "fechar-fundo" && e.target !== b) return;
  switch (a) {
    case "add": abrirForm(area); break;
    case "edit": abrirForm(area, id); break;
    case "del": {
      const L = lista(area), k = chave(area), i = L.findIndex(x => x.id === id); if (i < 0) break;
      const [it] = L.splice(i, 1); persist(k); render();
      toast("Apagado", () => { L.splice(i, 0, it); persist(k); render(); }); break;
    }
    case "tarefa": { const t = S.tarefas.find(x => x.id === id); if (t) { t.feito = !t.feito; persist("tarefas"); render(); } break; }
    case "conta": { const c = S.contas.find(x => x.id === id); if (c) { c.pago = !c.pago; persist("contas"); render(); } break; }
    case "hab": { const hb = S.habitos.find(x => x.id === id); if (hb) { const d = dia(); d.h[id] = Math.max(0, (d.h[id] || 0) + Number(b.dataset.d) * hb.passo); persist("log"); conferirRecorde(hb); render(); } break; }
    case "hab-cal": ui.habAberto[id] = !ui.habAberto[id]; render(); break;
    case "mes": { const [y, m] = ui.calMes.split("-").map(Number), d = new Date(y, m - 1 + Number(b.dataset.d), 1); const ym = d.getFullYear() + "-" + pad(d.getMonth() + 1); if (ym <= mesAtual()) { ui.calMes = ym; render(); } break; }
    case "ano": ui.ano += Number(b.dataset.d); render(); break;
    case "icone-pick": form.icone = b.textContent; b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "cor-pick": form.cor = +b.dataset.i; b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "mic": tocarMic(b.dataset.alvo); break;
    case "meta-feito": case "meta-foco": case "meta-del": {
      const p = planoDe(ui.ano), ar = p.areas.find(x => x.id === b.dataset.a); if (!ar) break;
      const ms = arr(ar.metas), i = ms.findIndex(x => x.id === id); if (i < 0) break; const m = ms[i];
      if (a === "meta-feito") { m.feito = !m.feito; if (m.feito) toast(m.foco ? "Foco conquistado! 🏆" : "Conquistado! ✨"); }
      else if (a === "meta-foco") { if (!m.foco && todasMetas(p).filter(x => x.foco).length >= 3) { toast("Já tem 3 focos. Tira a ⭐ de um antes."); break; } m.foco = !m.foco; }
      else { ms.splice(i, 1); toast("Meta apagada", () => { ms.splice(i, 0, m); salvarAno(); render(); }); }
      ar.metas = ms; salvarAno(); render(); break;
    }
    case "mood-del": {
      const p = planoDe(ui.ano), i = p.mood.findIndex(x => x.id === id); if (i < 0) break;
      const [im] = p.mood.splice(i, 1); salvarAno(); render();
      let voltou = false;
      toast("Foto removida", () => { voltou = true; p.mood.splice(i, 0, im); salvarAno(); render(); });
      setTimeout(() => { if (!voltou && assets) assets.delete(im.id).catch(() => {}); }, 6000); break;
    }
    case "planejar": rascunho = `Me ajuda a planejar meu ${ui.ano}. Me faz perguntas sobre cada área da vida e depois coloca as metas no plano, com 3 focos.`; location.hash = "agente"; break;
    case "treino-feito": { const d = dia(), i = d.t.indexOf(id); i < 0 ? d.t.push(id) : d.t.splice(i, 1); persist("log"); render(); break; }
    case "refeicao-feita": { const d = dia(), i = d.m.indexOf(id); i < 0 ? d.m.push(id) : d.m.splice(i, 1); persist("log"); render(); break; }
    case "seg": ui[b.dataset.k] = b.dataset.v; if (rota() !== b.dataset.k) { location.hash = b.dataset.k; e.preventDefault(); } else render(); break;
    case "filtro": ui.filtro = b.dataset.v; render(); break;
    case "passados": ui.passados = !ui.passados; render(); break;
    case "limpar-feitas": {
      const antes = S.tarefas.slice(); S.tarefas = S.tarefas.filter(t => !t.feito); persist("tarefas"); render();
      toast("Concluídas apagadas", () => { S.tarefas = antes; persist("tarefas"); render(); }); break;
    }
    case "dia-pick": { const i = +b.dataset.i; form.dias.has(i) ? form.dias.delete(i) : form.dias.add(i); b.setAttribute("aria-pressed", form.dias.has(i)); break; }
    case "fechar": case "fechar-fundo": fechar(); break;
    case "desfazer": if (desfazer) { desfazer(); desfazer = null; $("#toast").hidden = true; } break;
    case "sugestao": enviar(b.textContent); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && form) fechar(); });
document.addEventListener("submit", e => {
  const f = e.target; if (f.dataset.form !== "meta") return;
  e.preventDefault();
  const inp = f.querySelector("input"), t = str(inp.value); if (!t) return;
  const ar = planoDe(ui.ano).areas.find(x => x.id === f.dataset.a); if (!ar) return;
  ar.metas = arr(ar.metas); ar.metas.push({ id: uid(), texto: t, feito: false, foco: false });
  inp.value = ""; salvarAno(); render();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "mood-file") { subirFotos([...el.files]); el.value = ""; return; }
  const k = el.dataset && el.dataset.chg; if (!k) return;
  const p = planoDe(ui.ano), v = str(el.value);
  if (p[k] !== v) { p[k] = v; salvarAno(); if (k === "pinterest") render(); }
});
function conferirRecorde(hb) {
  const sd = seqDias(hb);
  if (sd > (hb.recorde || 0)) {
    hb.recorde = sd; persist("habitos");
    const md = MEDALHAS.find(([n]) => n === sd);
    if (md) toast(`${md[1]} ${md[2]} de ${hb.nome}! Medalha nova.`);
  }
}
init();
</script>
